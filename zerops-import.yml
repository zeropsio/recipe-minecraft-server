project:
  name: minecraft-server
  description: Java Edition Minecraft server hosted on zerops.io.
  tags:
    - minecraft
    - fun
services:
  - hostname: server
    type: java@21
    priority: 5
    maxContainers: 1
    verticalAutoscaling:
      minRam: 2
    buildFromGit: https://github.com/zeropsio/recipe-minecraft-server
    envSecrets:
      MC_WORLD_NAME: world
      MC_SEED: zerops_rules
  - hostname: disk
    type: local-storage:single@1
    priority: 10
